<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--fg:#f2f2f4;--sub:#9a9aa2;--card:#1e1f23;--line:#33353b;--ok:#4cc982;--ng:#ff6b6b;--ac:#6b9bff;--glass:#7c7c86}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;text-align:center;margin:24px 0 6px}
.sub{color:var(--sub);text-align:center;font-size:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0}
.seg button{flex:1;padding:10px;border:0;background:none;color:var(--fg);font-size:15px}
.seg button.on{background:var(--ac);color:#fff}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-size:17px;font-weight:600}
.menu button.hi{border-color:var(--ac)}
.menu small{color:var(--sub);font-weight:400;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:14px}
.link{border:0;background:none;color:var(--ac);font-size:15px;padding:6px 0}
.q{font-size:19px;font-weight:700;text-align:center;margin:18px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{min-height:68px;padding:10px;border:2px solid transparent;border-radius:12px;background:var(--card);color:var(--fg);font-size:15px;text-align:left;display:flex;align-items:center;gap:6px}
.ch.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.ch.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 18%,var(--card))}
.ch.dim{opacity:.55}
.sw{display:flex;justify-content:center;align-items:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.note{text-align:center;color:var(--sub);font-size:14px;margin:6px 0 10px}
.main{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;font-weight:700;margin-top:10px}
.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.score{font-size:22px;text-align:center;margin:8px 0 14px}
.rec{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;align-items:flex-start}
.rec .t{flex:1;font-size:14px}.rec b{font-size:15px}
.rec .sws{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:110px}
.g{color:var(--ok)}.r{color:var(--ng)}
</style>
</head>

function swatch(col,style,scale){
  const c=C[col],w=80*scale,h=90*scale;
  const sh="M2,2 V80 Q2,88 12,88 H68 Q78,88 78,80 V2";
  let body="";
  if(style==="l") body=`<path d="M2,22 V80 Q2,88 12,88 H68 Q78,88 78,80 V22Z" fill="${c}"/><path d="${sh}" fill="none" stroke="var(--glass)" stroke-width="2"/>`;
  else if(style==="p") body=`<path d="M2,22 V80 Q2,88 12,88 H68 Q78,88 78,80 V22Z" fill="#4a90e2" fill-opacity=".14"/><ellipse cx="40" cy="81" rx="28" ry="8" fill="${c}" stroke="var(--glass)" stroke-opacity=".6"/><path d="${sh}" fill="none" stroke="var(--glass)" stroke-width="2"/>`;
  else body=`<rect width="80" height="90" rx="10" fill="#1d1d22"/><path transform="translate(17,10)" d="M23,0 C29,19 46,34 46,53 Q23,80 0,53 C0,34 17,19 23,0Z" fill="${c}"/><path transform="translate(30.5,48)" d="M9.5,0 C15.5,9 19,16 19,25 Q9.5,38 0,25 C0,16 3.5,9 9.5,0Z" fill="#fff" fill-opacity=".55"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 80 90">${body}</svg>`;
}
const swatches=(q,s)=>q.cols.map((c,i)=>(i?`<span style="color:var(--sub)">→</span>`:"")+swatch(c,q.style,s)).join("");

const S={phase:"menu",count:10,cat:null,deck:[],i:0,choices:[],sel:null,rec:[]};
const $=document.getElementById("app");

function makeChoices(){
  const q=S.deck[S.i];if(!q){S.choices=[];return}
  if(q.cat===6){S.choices=["溶ける","溶けない"];return}
  if(q.cat===7){S.choices=["酸化剤","還元剤","両方(相手による)","どちらでもない"];return}
  const picked=[];
  const same=shuf(Q.filter(x=>x.cat===q.cat)),oth=shuf(Q.filter(x=>x.cat!==q.cat&&x.cat!==6&&x.cat!==7));
  const list=[...same,...oth].sort((x,y)=>(kind(y.a)===kind(q.a))-(kind(x.a)===kind(q.a)));
  for(const it of list){
    const a=it.a;
    if(a===q.a||picked.includes(a)||conf(a,q.a)||picked.some(p=>conf(p,a)))continue;
    picked.push(a);if(picked.length===3)break;
  }
  S.choices=shuf([...picked,q.a]);
}
function begin(list){S.deck=list;S.i=0;S.sel=null;S.rec=[];S.phase="quiz";makeChoices();render()}
function start(cat){
  S.cat=cat;
  const pool=shuf(cat===null?Q:Q.filter(q=>q.cat===cat));
  begin(S.count?pool.slice(0,S.count):pool);
}
const wrongList=()=>S.rec.filter(r=>r.chosen!==r.q.a).map(r=>r.q);
function pick(c){if(S.sel!==null)return;S.sel=c;S.rec.push({q:S.deck[S.i],chosen:c});render()}
function next(){S.i++;S.sel=null;if(S.i>=S.deck.length){S.phase="result"}else makeChoices();render();window.scrollTo(0,0)}
function menu(){S.phase="menu";render()}

function render(){
  if(S.phase==="menu"){
    $.innerHTML=`<h1>化学 一問一答</h1><div class="sub">出題数を選んでから、種類を選んでください</div>
    <div class="seg">${[[10,"10問"],[20,"20問"],[0,"全部"]].map(([n,l])=>`<button class="${S.count===n?"on":""}" data-n="${n}">${l}</button>`).join("")}</div>
    <div class="menu"><button class="hi" data-c="all">全部(ランダム)<small>全${Q.length}問</small></button>
    ${CATS.map((n,i)=>`<button data-c="${i}">${n}<small>全${Q.filter(q=>q.cat===i).length}問</small></button>`).join("")}</div>`;
    $.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.count=+b.dataset.n;render()});
    $.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>start(b.dataset.c==="all"?null:+b.dataset.c));
  }else if(S.phase==="quiz"){
    const q=S.deck[S.i],done=S.sel!==null,last=S.i+1>=S.deck.length;
    $.innerHTML=`<div class="top"><button class="link" id="quit">やめる</button><span>${S.i+1} / ${S.deck.length}</span></div>
    <div class="q">${q.q}</div>
    <div class="grid">${S.choices.map((c,i)=>{
      let k="ch";if(done){if(c===q.a)k+=" ok";else if(c===S.sel)k+=" ng";else k+=" dim"}
      return `<button class="${k}" data-i="${i}" ${done?"disabled":""}>${c}${done&&c===q.a?" ✓":""}${done&&c===S.sel&&c!==q.a?" ✗":""}</button>`}).join("")}</div>
    ${done?`<div class="sw">${swatches(q,1)}</div>${q.note?`<div class="note">${q.note}</div>`:""}<button class="main" id="nx">${last?"結果を見る":"次へ"}</button>`:""}`;
    $.querySelector("#quit").onclick=menu;
    $.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>pick(S.choices[+b.dataset.i]));
    if(done)$.querySelector("#nx").onclick=next;
  }else{
    const ok=S.rec.filter(r=>r.chosen===r.q.a).length,w=wrongList();
    $.innerHTML=`<h1>結果</h1><div class="score">正解 ${ok} / ${S.rec.length}</div>
    ${S.rec.map((r,i)=>{const good=r.chosen===r.q.a;return `<div class="rec"><div class="t"><b>${i+1}. ${r.q.q}</b><br>
      ${good?`<span class="g">○ 正解:${r.q.a}</span>`:`<span class="r">× あなたの答え:${r.chosen}</span><br><span class="g">正解:${r.q.a}</span>`}
      ${r.q.note?`<br><small style="color:var(--sub)">${r.q.note}</small>`:""}</div><div class="sws">${swatches(r.q,.5)}</div></div>`}).join("")}
    ${w.length?`<button class="main" id="rv">間違えた ${w.length} 問を復習</button>`:""}
    <button class="main sec" id="rs">もう一度</button><button class="main sec" id="bk">ホームに戻る</button>`;
    if(w.length)$.querySelector("#rv").onclick=()=>begin(shuf(w));
    $.querySelector("#rs").onclick=()=>start(S.cat);
    $.querySelector("#bk").onclick=menu;
    window.scrollTo(0,0);
  }
}
render();
</script>
</body>
</html>
